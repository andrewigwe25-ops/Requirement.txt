
  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argzeonax AI - Sovereign Matrix Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-mono min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold tracking-wider text-cyan-400">Argzeonax AI</h1>
            <p class="text-xs text-slate-500 uppercase">Sovereign Planetary Intelligence Matrix</p>
        </header>

        <!-- Telemetry Feed -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg space-y-3">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Matrix Telemetry Feed</h3>
            <div id="telemetry" class="bg-slate-950 p-4 rounded-lg text-cyan-300 text-sm border border-slate-800/60">
                Connecting to WebSocket core...
            </div>
        </section>

        <!-- Command Execution -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg space-y-4">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Command Macro Directive</h3>
            <textarea id="directiveInput" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition-colors">Optimize regional power grids and scale aerospace manufacturing</textarea>
            <button onclick="executeDirective()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 px-4 rounded-lg text-sm transition-colors tracking-wide shadow-md">
                Execute Directive
            </button>
        </section>

        <!-- System Response Logs -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg space-y-3">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-widest">System Response Logs</h3>
            <pre id="output" class="bg-slate-950 border border-slate-800/60 p-4 rounded-lg text-xs text-cyan-300 whitespace-pre-wrap min-h-[100px]">System ready. Awaiting input...</pre>
        </section>

    </div>

    <script>
        // Live Render Backend URL
        const API_URL = "https://requirement-txt-aq56.onrender.com";

        // Connect to Live WebSocket Telemetry with secure wss:// protocol
        function connectWebSocket() {
            const wsProtocol = API_URL.startsWith("https") ? "wss://" : "ws://";
            const cleanUrl = API_URL.replace("https://", "").replace("http://", "");
            const ws = new WebSocket(`${wsProtocol}${cleanUrl}/ws/telemetry`);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                document.getElementById('telemetry').innerHTML = `
                    Status: ${data.status} | 
                    Grid Stability: ${(data.energy_stability_index * 100).toFixed(2)}% | 
                    Active Foundries: ${data.active_foundries} | 
                    Edge Nodes: ${data.active_edge_nodes}
                `;
            };

            ws.onclose = () => {
                setTimeout(connectWebSocket, 3000); // Reconnect automatically if dropped
            };
        }

        // Execute Command Directive via POST API
        async function executeDirective() {
            const directiveText = document.getElementById('directiveInput').value;
            const outputLog = document.getElementById('output');
            
            outputLog.innerText = "Transmitting directive to sovereign matrix core...";

            try {
                const response = await fetch(`${API_URL}/api/execute`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ directive: directiveText })
                });

                const result = await response.json();
                outputLog.innerText = JSON.stringify(result, null, 2);
            } catch (error) {
                outputLog.innerText = `ERROR: Failed to reach backend core.\nDetails: ${error}`;
            }
        }

        // Initialize telemetry connection on page load
        connectWebSocket();
    </script>
</body>
</html>
