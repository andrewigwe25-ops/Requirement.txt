<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Argzeonax AI // Live Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans">
    <div class="max-w-xl mx-auto space-y-6">
        <div>
            <h1 class="text-2xl font-bold text-cyan-400">Argzeonax AI</h1>
            <p class="text-xs text-slate-400">Sovereign Planetary Intelligence Matrix</p>
        </div>

        <!-- Live Telemetry Card -->
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2">
            <h2 class="text-xs font-semibold text-cyan-500 uppercase tracking-wider">Matrix Telemetry Feed</h2>
            <div id="telemetry" class="text-xs font-mono text-slate-300">Connecting to WebSocket core...</div>
        </div>

        <!-- Command Section -->
        <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 space-y-4">
            <h2 class="text-sm font-semibold text-slate-300">Command Macro Directive</h2>
            <textarea id="objective" rows="3" placeholder="e.g., Optimize regional power grids and scale aerospace manufacturing..." class="w-full bg-slate-950 p-3 rounded border border-slate-800 text-sm text-white focus:outline-none focus:border-cyan-500"></textarea>
            <button onclick="executeDirective()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold p-3 rounded text-sm transition-all">Execute Directive</button>
        </div>

        <!-- Output Log -->
        <div class="space-y-2">
            <h3 class="text-xs font-semibold text-slate-400">System Response Logs</h3>
            <pre id="output" class="bg-slate-900 p-4 rounded text-xs text-cyan-300 font-mono overflow-auto h-48 border border-slate-800">System ready. Awaiting input...</pre>
        </div>
    </div>

    <script>
        // REPLACE THIS WITH YOUR LIVE RENDER URL FROM RENDER DASHBOARD
        ==> Available at your primary URL https://requirement-txt-aq56.onrender.com

        // Connect to Live WebSocket Telemetry
        function connectWebSocket() {
            const wsProtocol = API_URL.startsWith("https") ? "wss://" : "ws://";
            const cleanUrl = API_URL.replace("https://", "").replace("http://", "");
            const ws = new WebSocket(`${wsProtocol}${cleanUrl}/ws/telemetry`);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                document.getElementById('telemetry').innerHTML = `
                    Grid Stability: ${(data.energy_stability_index * 100).toFixed(2)}% | 
                    Active Foundries: ${data.active_foundries} | 
                    Edge Nodes: ${data.active_edge_nodes}
                `;
            };

            ws.onclose = () => {
                setTimeout(connectWebSocket, 3000); // Reconnect automatically if dropped
            };
        }
        connectWebSocket();

        // Execute AI Directive
        async function executeDirective() {
            const objective = document.getElementById('objective').value;
            if (!objective) return alert("Please enter a directive.");

            document.getElementById('output').innerText = "Processing directive across matrix pillars...";

            try {
                const res = await fetch(`${API_URL}/api/execute`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ macro_objective: objective })
                });
                const data = await res.json();
                document.getElementById('output').innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                document.getElementById('output').innerText = "Error connecting to backend matrix: " + err;
            }
        }
    </script>
</body>
              </html>
